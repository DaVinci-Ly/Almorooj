      <path d="M0-14c-6.5.4-10.5 4-12 9.6 6-.4 10.4-3.6 12-9.6z" fill="currentColor"/>
      <path d="M0-20c6.5.4 10.5 4 12 9.6-6-.4-10.4-3.6-12-9.6z" fill="currentColor"/>
      <path d="M0-46c3-3.4 3-9.6 0-14-3 4.4-3 10.6 0 14z" fill="currentColor"/>
      <path d="M0-24c5-1.4 8-6.6 8-11.6-5 1.4-8 6.6-8 11.6z" fill="currentColor"/>
      <path d="M0-24c-5-1.4-8-6.6-8-11.6 5 1.4 8 6.6 8 11.6z" fill="currentColor"/>
      <path d="M0-32c5-1.4 8-6.6 8-11.6-5 1.4-8 6.6-8 11.6z" fill="currentColor"/>
