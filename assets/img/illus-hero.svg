  <circle cx="300" cy="250" r="225" fill="#e6eeeb"/>
  <circle cx="300" cy="152" r="64" fill="#e8d5a8"/>

  <!-- الأرض -->
  <path d="M116.4 380a225 225 0 0 0 367.2 0z" fill="#d9e5e1"/>
  <g fill="none" stroke="#5c857b" stroke-width="2.5" stroke-linecap="round" opacity="0.2">
