    <path d="M172 428q128-12 256 0"/>
    <path d="M204 452q96-10 192 0"/>
  </g>

  <!-- الصوامع -->
  <g fill="#fbf8f3" stroke="#2f0f06" stroke-width="3" stroke-linejoin="round">
