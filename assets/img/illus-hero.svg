      <path d="M0-40c5-1.4 8-6.6 8-11.6-5 1.4-8 6.6-8 11.6z" fill="currentColor"/>
      <path d="M0-40c-5-1.4-8-6.6-8-11.6 5 1.4 8 6.6 8 11.6z" fill="currentColor"/>
