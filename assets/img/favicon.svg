    <path d="M32 47c-3.6-7-3.6-16 0-23 3.6 7 3.6 16 0 23z" transform="rotate(-33 32 47)"/>
    <path d="M32 47c-3.6-7-3.6-16 0-23 3.6 7 3.6 16 0 23z" transform="rotate(33 32 47)"/>
