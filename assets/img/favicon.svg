<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="رمز شركة المروج الخضراء">
  <!--
    نسخة مبسّطة من ختم الشركة، مرسومة خصيصاً لتبقى مقروءة بحجم 16px
    في شريط المتصفّح. الشعار الكامل موجود في logo.png.
  -->
  <circle cx="32" cy="32" r="31" fill="#2f0f06"/>
  <circle cx="32" cy="32" r="25" fill="#fbf8f3"/>

  <!-- قوس الترس -->
