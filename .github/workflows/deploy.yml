name: نشر الموقع على GitHub Pages

# ينشر الموقع تلقائياً عند كل تعديل يصل إلى الفرع main.
# الموقع ملفات ثابتة، فلا توجد مرحلة بناء — تُرفع كما هي.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# نسمح بنشر واحد فقط في كل مرة، دون إلغاء نشر جارٍ
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: جلب الملفات
        uses: actions/checkout@v4

      - name: تهيئة GitHub Pages
        uses: actions/configure-pages@v5

      - name: تجهيز الملفات للرفع
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
